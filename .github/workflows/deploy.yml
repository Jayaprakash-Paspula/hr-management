name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        type: string
  #push:
  #  branches:
  #    - main
  #  paths:
  #    - 'backend/**'
  #    - 'frontend/**'

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # 🔹 Pre-deployment checks
  pre-deploy-checks:
    runs-on: ubuntu-latest
    outputs:
      deploy-env: ${{ steps.set-env.outputs.deploy-env }}
      deploy-version: ${{ steps.set-version.outputs.deploy-version }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="staging"
          fi
          echo "deploy-env=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENV"

      - name: Set deployment version
        id: set-version
        run: |
          if [[ -z "${{ github.event.inputs.version }}" ]]; then
            VERSION="latest"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "deploy-version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check secrets
        run: |
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]] || [[ -z "${{ secrets.DOCKER_PASSWORD }}" ]]; then
            echo "❌ Docker credentials not configured"
            exit 1
          fi
          echo "✅ Secrets configured"

  # 🔹 Staging Deployment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.deploy-env == 'staging'
    environment:
      name: staging
      url: https://staging.hrms.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest images
        run: |
          docker pull ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ needs.pre-deploy-checks.outputs.deploy-version }}
          docker pull ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ needs.pre-deploy-checks.outputs.deploy-version }}

      - name: Deploy to staging (Placeholder)
        run: |
          echo "🚀 Deploying to Staging"
          echo "Backend: ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo "Frontend: ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo ""
          echo "Update your deployment platform (AWS, GCP, Azure, etc.) here"
          echo "Example commands:"
          echo "  - kubectl set image deployment/hrms-backend backend=${{ env.DOCKER_USERNAME }}/hrms-backend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo "  - kubectl set image deployment/hrms-frontend frontend=${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 10
          echo "✅ Health check passed (placeholder)"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          echo "✅ Smoke tests passed (placeholder)"

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

  # 🔹 Production Deployment
  deploy-production:
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.deploy-env == 'production'
    environment:
      name: production
      url: https://hrms.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require approval
        run: |
          echo "⚠️  Production deployment requires manual approval"
          echo "Version: ${{ needs.pre-deploy-checks.outputs.deploy-version }}"

      - name: Pull latest images
        run: |
          docker pull ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ needs.pre-deploy-checks.outputs.deploy-version }}
          docker pull ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ needs.pre-deploy-checks.outputs.deploy-version }}

      - name: Create database backup
        run: |
          echo "📦 Creating database backup..."
          # This is a placeholder - implement actual backup logic
          echo "✅ Backup created"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to Production"
          echo "Backend: ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo "Frontend: ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo ""
          echo "Update your deployment platform here"

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          sleep 15
          echo "✅ Integration tests passed (placeholder)"

      - name: Database migration
        run: |
          echo "Running database migrations..."
          echo "✅ Migrations completed (placeholder)"

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,actor
        continue-on-error: true

  # 🔹 Post-deployment validation
  post-deploy-validation:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Validate deployment
        run: |
          echo "Post-deployment validation"
          echo "Environment: ${{ needs.pre-deploy-checks.outputs.deploy-env }}"
          echo "✅ Deployment complete"

      - name: Create deployment record
        run: |
          echo "Recording deployment..."
          echo "Version: ${{ needs.pre-deploy-checks.outputs.deploy-version }}"
          echo "Environment: ${{ needs.pre-deploy-checks.outputs.deploy-env }}"
          echo "✅ Recorded"

